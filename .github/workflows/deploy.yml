name: Build and deploy app

# Runs when app code changes on main (or manually from the Actions tab).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Required for OIDC: lets the job request a token to prove its identity to AWS.
permissions:
  id-token: write
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-lab-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true


      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: app
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          # Find the running app server by its Terraform-applied tags.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ]; then
            echo "No running instance tagged Role=app. Did you terraform apply?"
            exit 1
          fi
          echo "Deploying $IMAGE to $INSTANCE_ID"

          # The script that runs ON the instance (placeholders filled by sed below).
          cat > deploy.sh << 'SCRIPT'
          set -e
          aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__
          docker pull __IMAGE__
          docker rm -f app || true
          docker run -d --name app --restart always -p 127.0.0.1:8000:8000 __IMAGE__
          for i in $(seq 1 10); do
            if curl -fs http://127.0.0.1:8000/health; then echo; echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "health check failed"
          docker logs app
          exit 1
          SCRIPT
          sed -i "s|__REGION__|$AWS_REGION|g; s|__REGISTRY__|$REGISTRY|g; s|__IMAGE__|$IMAGE|g" deploy.sh

          # Wrap the script as the JSON SSM expects.
          jq -Rs '{commands: [.]}' deploy.sh > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --comment "Deploy ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          if aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
            RESULT=0
          else
            RESULT=1
          fi

          echo "----- output from instance -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          exit $RESULT